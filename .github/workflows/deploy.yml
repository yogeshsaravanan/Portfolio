name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ] # Change to "master" if your default branch uses that name

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build # Vite outputs to 'dist'. CRA outputs to 'build'.

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Build Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # ⚠️ CRITICAL: If using Vite, change this path to 'dist'. If using CRA, change it to 'build'.
          path: 'dist 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4